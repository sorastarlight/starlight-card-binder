<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registered User Directory | Starlight Card Binder</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.2">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.16">
  <link rel="stylesheet" href="css/pages/admin-shell.css?v=1.0.0">
  <link rel="stylesheet" href="css/pages/admin-users.css?v=1.1.0">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.8">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body class="admin-suite">
  <script src="js/embed-mode.js" type="module"></script>
  <div class="admin-suite-frame">
    <nav class="admin-suite-crumb" id="adminCrumb" aria-label="Administration breadcrumb"></nav>
    <header class="admin-suite-header">
      <div>
        <h1>Registered User Directory</h1>
        <p class="admin-suite-lead">Search account identities, staff access, profile visibility, and linked Twitch accounts.</p>
      </div>
    </header>
    <div class="admin-panel">
      <div class="admin-toolbar toolbar">
        <input id="search" type="search" placeholder="Search email, username, display name, or Twitch…">
        <button id="refresh" class="admin-btn admin-btn--primary" type="button">Search</button>
      </div>
      <p id="status" class="admin-status status">Loading users…</p>
      <div class="admin-table-wrap table-wrap">
        <table>
          <thead>
            <tr>
              <th>Display Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Twitch</th>
              <th>Role</th>
              <th>Visibility</th>
              <th>Joined</th>
              <th>Last Sign-in</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </div>
    <a class="admin-back-link" href="admin-hub.html">Return to Administration Hub</a>
  </div>
  <script type="module" src="js/pages/admin-users-page.js?v=1.1.0"></script>
  <script src="js/shared-ui.js?v=1.6.16"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
