<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notification Broadcasts | Starlight Card Binder</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.2">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.16">
  <link rel="stylesheet" href="css/pages/admin-shell.css?v=1.0.0">
  <link rel="stylesheet" href="css/pages/admin-notifications.css?v=1.1.0">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.8">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body class="admin-suite">
  <script src="js/embed-mode.js" type="module"></script>
  <div class="admin-suite-frame">
    <nav class="admin-suite-crumb" id="adminCrumb" aria-label="Administration breadcrumb"></nav>
    <header class="admin-suite-header">
      <div>
        <h1>Notification Broadcasts</h1>
        <p class="admin-suite-lead">Send an on-site announcement to every registered collector.</p>
      </div>
    </header>
    <div class="admin-panel">
      <form id="form" class="form-grid">
        <label>Icon<input id="icon" maxlength="8" value="🌟"></label>
        <label>Destination
          <select id="route">
            <option value="events">Starlight Events</option>
            <option value="binder">Card Binder</option>
            <option value="daily">Free Daily Starlight Pack</option>
            <option value="shop">Starlight Card Shop</option>
            <option value="collection">My Collection</option>
            <option value="">No destination</option>
          </select>
        </label>
        <label class="wide">Title<input id="title" maxlength="100" required placeholder="A new Starlight event has begun!"></label>
        <label class="wide">Message<textarea id="body" maxlength="500" rows="5" required placeholder="Tell collectors what is happening..."></textarea></label>
        <label>Expires (optional)<input id="expires" type="datetime-local"></label>
        <div class="form-submit">
          <button class="admin-btn admin-btn--primary" type="submit">Send Broadcast</button>
        </div>
      </form>
      <div class="preview">
        <strong>Broadcasts appear in the notification bell and Notifications page.</strong>
        <p id="status" class="admin-status status" role="status"></p>
      </div>
    </div>
    <a class="admin-back-link" href="admin-hub.html">Return to Administration Hub</a>
  </div>
  <script type="module" src="js/pages/admin-notifications-page.js?v=1.1.0"></script>
  <script src="js/shared-ui.js?v=1.6.16"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
