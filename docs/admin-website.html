<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Website Editor | Starlight Card Binder</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.2">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.16">
  <link rel="stylesheet" href="css/pages/admin-shell.css?v=1.1.1">
  <link rel="stylesheet" href="css/pages/admin-website.css?v=2.3.0">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.8">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body class="admin-suite">
  <script src="js/embed-mode.js" type="module"></script>
  <div class="admin-suite-frame admin-suite-frame--wide">
    <nav class="admin-suite-crumb" id="adminCrumb" aria-label="Administration breadcrumb"></nav>
    <header class="admin-suite-header">
      <div>
        <h1>Website Editor</h1>
        <p class="admin-suite-lead">Pick a page and edit its copy. Save publishes site-wide. Navigation menus are edited in Navigation Studio.</p>
      </div>
      <div class="admin-suite-actions admin-toolbar">
        <button id="resetPageBtn" class="admin-btn" type="button" hidden>Reset This Page</button>
        <button id="saveBtn" class="admin-btn admin-btn--primary" type="button" hidden>Save Changes</button>
        <button id="resetBtn" class="admin-btn admin-btn--danger" type="button" hidden>Reset Everything</button>
      </div>
    </header>
    <p id="status" class="admin-status status" role="status">Checking staff access…</p>
    <div class="admin-panel studio-panel">
      <div id="app" class="hidden studio-app" hidden>
        <aside class="page-picker" aria-label="Website pages">
          <label class="field-search">
            <span class="sr-only">Search fields</span>
            <input id="fieldSearch" type="search" placeholder="Search fields…" autocomplete="off">
          </label>
          <div id="tablist" class="page-list" role="tablist" aria-label="Website pages"></div>
        </aside>

        <section class="studio-editor">
          <div id="pageMeta" class="page-meta"></div>
          <section id="editorPanel" class="tab-panel editor-scroll" role="tabpanel"></section>
        </section>
      </div>
    </div>
    <a class="admin-back-link" href="admin-hub.html">Return to Administration Hub</a>
  </div>

  <script type="module" src="js/pages/admin-website-page.js?v=2.6.0"></script>
  <script src="js/shared-ui.js?v=1.6.16"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
