<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seasonal Collection Pass | Starlight Card Binder</title>
  <link rel="icon" href="site_assets/Sora_Starlight_Logo_Primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tcg/site.css?v=2.0">
  <link rel="stylesheet" href="css/tcg/pages.css?v=2.0">
  <link rel="stylesheet" href="css/tcg/compat.css?v=2.0">
  <link rel="stylesheet" href="css/pages/season-pass.css?v=1.6">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.11">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body data-page="season-pass">
  <div id="site-header"></div>
  <main id="main" class="season-pass-page">
    <section class="season-pass-hero panel">
      <div class="season-pass-hero-head">
        <p class="eyebrow" data-content="seasonPass.eyebrow">My Stuff</p>
        <div class="season-activation-banner" id="season-activation-banner" hidden></div>
      </div>
      <h1 id="season-title" data-content="seasonPass.title">Seasonal Collection Pass</h1>
      <p id="season-lead" class="season-pass-intro" data-content="seasonPass.lead" hidden>A free seasonal track for Twitch subscribers. Earn points from boosters, trades, gifts, favorites, and visits — then claim Star Bits and titles.</p>
      <div class="season-benefits" id="season-benefits" hidden>
        <aside class="season-pass-promo" aria-label="Season Pass exclusive offer">
          <div class="season-pass-promo-card-wrap">
            <img class="season-pass-promo-card" src="site_assets/StarlightCard_Back_NewLogo.png" alt="" width="168" height="235" decoding="async">
            <button type="button" class="season-pass-promo-help" id="season-promo-help" aria-label="About this exclusive card">?</button>
          </div>
          <p class="season-pass-promo-copy">
            <strong data-content="seasonPass.exclusivePromoTitle">Exclusive to the Twitch Seasonal Pass!</strong>
            <a class="season-pass-promo-link" data-content="seasonPass.exclusivePromoLink" href="https://twitch.tv/sorastarlight" rel="noopener noreferrer" target="_blank">Subscribe on Twitch.tv/sorastarlight</a>
          </p>
        </aside>
        <div class="season-benefits-body" id="season-benefits-body"></div>
      </div>
    </section>
    <section class="season-pass-summary panel" id="season-summary">
      <p data-content="seasonPass.loadingLead">Loading season progress…</p>
    </section>
    <section class="season-pass-track" id="season-track" aria-label="Season reward tiers"></section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/tcg-chrome.js?v=2.0"></script>
  <script type="module" src="js/pages/website-content-hydrate-page.js?v=1.3"></script>
  <script type="module" src="js/pages/season-pass-page.js?v=2.3"></script>
  <script src="js/shared-ui.js?v=1.6.15"></script>
  <script src="js/qol-ui.js?v=94.2.9" defer></script>
</body>
</html>
