<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <title>Moderation Dashboard | Starlight Card Binder</title>
  <link href="css/style.css?v=1.0.2" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.16">
  <link rel="stylesheet" href="css/pages/admin-shell.css?v=1.0.0">
  <link rel="stylesheet" href="css/pages/admin-moderation.css?v=1.1.0">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.8">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body class="admin-suite">
  <script src="js/embed-mode.js" type="module"></script>
  <div class="admin-suite-frame">
    <nav class="admin-suite-crumb" id="adminCrumb" aria-label="Administration breadcrumb"></nav>
    <header class="admin-suite-header">
      <div>
        <h1>Moderation Dashboard</h1>
        <p class="admin-suite-lead">Review collector-profile reports, document decisions, and temporarily hide or lock profiles.</p>
      </div>
    </header>
    <p class="admin-status status" id="status">Checking moderation access…</p>
    <div class="admin-panel">
      <div class="admin-toolbar toolbar">
        <label>Status <select id="filter"><option value="open">Open</option><option value="reviewing">Reviewing</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option><option value="all">All</option></select></label>
        <button class="btnx admin-btn admin-btn--primary" id="refresh" type="button">Refresh Queue</button>
      </div>
      <div class="report-list" id="list"></div>
    </div>
    <a class="admin-back-link" href="admin-hub.html">Return to Administration Hub</a>
  </div>
  <div aria-hidden="true" class="st-dialog-overlay hidden" id="hide-profile-modal">
    <section aria-labelledby="hide-profile-title" aria-modal="true" class="st-dialog" role="dialog" tabindex="-1">
      <button type="button" class="st-dialog-close" data-st-modal-close aria-label="Close">×</button>
      <h2 id="hide-profile-title">Hide and lock profile</h2>
      <p class="muted">Explain why this collector profile is being hidden. This note is stored with the moderation action.</p>
      <label for="hide-profile-reason">Reason</label>
      <textarea id="hide-profile-reason" rows="4" maxlength="500" required></textarea>
      <div class="st-dialog-actions">
        <button type="button" class="st-dialog-cancel" data-st-modal-close>Cancel</button>
        <button type="button" class="st-dialog-confirm danger" id="confirm-hide-profile">Hide + Lock Profile</button>
      </div>
    </section>
  </div>
  <script type="module" src="js/pages/admin-moderation-page.js?v=1.2.0"></script>
  <script src="js/shared-ui.js?v=1.6.16"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
