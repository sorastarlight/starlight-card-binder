<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reward Code Admin | Starlight Card Binder</title>
  <link rel="icon" href="site_assets/Sora_Starlight_Logo_Primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tcg/site.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/pages.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/compat.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/admin.css?v=1.0">
  <link rel="stylesheet" href="css/pages/admin-codes.css?v=1.0">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.11">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body data-page="admin">
  <div id="site-header"></div>
  <main id="main" class="admin-page"><p><a class="admin-back-link" href="admin-hub.html">← Administration Hub</a></p><section class="panelx"><p class="eyebrow">Administrator</p><h1>Reward Code Console</h1><p>Create single-card, booster, or Star Bits codes. Full codes are only shown when created, so copy them immediately.</p><p class="status" id="gate-status">Checking administrator access…</p></section>
  <section class="hidden" id="admin-content"><section class="panelx"><h2>Create Reward Code</h2><form class="grid" id="create-form"><div><label for="code">Code</label><input id="code" maxlength="40" required=""/><button class="btnx space-top-sm" id="generate" type="button">Generate Code</button></div><div><label for="label">Internal label</label><input id="label" maxlength="80" required=""/></div><div><label for="reward-type">Reward type</label><select id="reward-type"><option value="single_card">Single Card</option><option value="booster">Booster / Multiple Cards</option><option value="star_bits">Star Bits</option></select></div><div><label for="max-uses">Maximum total uses</label><input id="max-uses" min="1" placeholder="Unlimited" type="number"/></div><div id="single-card-fields"><label for="single-card">Card</label><select id="single-card"></select><label class="space-top-sm" for="card-quantity">Quantity</label><input id="card-quantity" min="1" type="number" value="1"/></div><div class="hidden" id="star-bits-fields"><label for="star-bits">Star Bits amount</label><input id="star-bits" min="1" type="number" value="100"/></div><div class="full hidden" id="booster-fields"><label>Booster cards</label><div class="card-pick" id="card-pick"></div></div><div><label for="starts-at">Starts at</label><input id="starts-at" type="datetime-local"/></div><div><label for="expires-at">Expires at</label><input id="expires-at" type="datetime-local"/></div><div class="full"><button class="btnx" id="create-button" type="submit">Create Reward Code</button></div></form><p class="status" id="create-status"></p></section>
  <section class="panelx"><h2>Existing Codes</h2><div class="code-list" id="code-list"></div></section></section></main>
  <div id="site-footer"></div>
  <script type="module" src="js/tcg-chrome.js?v=1.0"></script>
  <script type="module" src="js/pages/admin-codes-page.js?v=1.0"></script>
  <script src="js/shared-ui.js?v=1.6.15"></script>
  <script src="js/qol-ui.js?v=94.2.4" defer></script>
</body>
</html>
