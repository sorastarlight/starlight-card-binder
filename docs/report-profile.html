<body data-page="report">
  <div id="site-header"></div>
  <main id="main" class="report-page"><section class="panelx"><p class="eyebrow">Collector Safety</p><h1>Report a Collector Profile</h1><p>Reports are private and visible only to authorized Starlight staff.</p><form id="form"><div class="field"><label for="username">Collector username</label><input id="username" maxlength="24" required=""/></div><div class="field"><label for="category">Reason</label><select id="category"><option value="impersonation">Impersonation</option><option value="harassment">Harassment</option><option value="inappropriate_profile">Inappropriate profile</option><option value="spam">Spam</option><option value="other">Other</option></select></div><div class="field"><label for="details">What happened?</label><textarea id="details" maxlength="1000" minlength="10" required=""></textarea></div><div class="actions"><button id="submit" type="submit">Submit Report</button><a id="report-cancel" href="index.html">Cancel</a></div><p class="status" id="status" role="status"></p></form></section></main>
