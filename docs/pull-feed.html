<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LIVE Feed | Starlight Card Binder</title>
  <link rel="icon" href="site_assets/Sora_Starlight_Logo_Primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tcg/site.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/pages.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/compat.css?v=1.0">
  <link rel="stylesheet" href="css/pages/pull-feed.css?v=1.1">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.11">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body data-page="feed">
  <div id="site-header"></div>
  <main id="main" class="pull-feed-page">
    <header class="pull-feed-header">
      <p class="eyebrow">Community</p>
      <h1>📡 LIVE Feed</h1>
      <p class="lead">Live collector moments — pulls, gifts, follows, and more.</p>
    </header>
  
    <div class="pull-feed-filters" role="tablist" aria-label="Feed filter">
      <button type="button" class="pull-feed-filter active" data-feed-filter="everyone" role="tab" aria-selected="true">Everyone</button>
      <button type="button" class="pull-feed-filter" data-feed-filter="friends" role="tab" aria-selected="false">Following</button>
      <button type="button" class="pull-feed-filter" data-feed-filter="you" role="tab" aria-selected="false">Just You</button>
    </div>
  
    <p class="pull-feed-status" id="pull-feed-status" role="status">Loading feed…</p>
    <section class="pull-feed-list" id="pull-feed-list" aria-live="polite"></section>
    <div class="pull-feed-actions">
      <button type="button" class="btn" id="pull-feed-more" hidden>Load more</button>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/tcg-chrome.js?v=1.0"></script>
  <script src="js/pages/pull-feed-page.js?v=1.3" type="module"></script>
  <script src="js/shared-ui.js?v=1.6.15"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
