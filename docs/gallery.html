<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Starlight Card Gallery | Starlight Cards</title>
  <link rel="icon" href="site_assets/Sora_Starlight_Logo_Primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tcg/site.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/pages.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/compat.css?v=1.0">
  <link rel="stylesheet" href="css/card-filters.css?v=1.1">
  <link rel="stylesheet" href="css/pages/card-gallery-page.css?v=2.1.1">
  <link rel="stylesheet" href="css/card-view-transition.css?v=1.0.0">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
  <link rel="stylesheet" href="css/prestige-frames.css?v=3.8">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.11">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body data-page="gallery">
  <div id="site-header"></div>
  <main id="main">
    <header class="page-hero">
      <div class="asset-placeholder bg" aria-hidden="true">INSERT ASSET</div>
      <p class="kicker">Starlight Cards</p>
      <h1 id="seriesHeroTitle">Starlight Card Gallery</h1>
      <p class="lead" id="seriesHeroDescription">Browse every card in the series. Uncollected cards show the card back until you earn them.</p>
    </header>
    <div class="card-gallery-page">
      <div class="card-gallery-toolbar panel" id="seriesHeroToolbar" hidden></div>
      <div class="card-gallery-stats panel" id="seriesHeroStats"></div>
      <div class="card-gallery-progress panel" id="tcgGalleryProgress" hidden></div>
      <p class="card-gallery-summary" data-filter-summary role="status" aria-live="polite"></p>
      <section class="card-filter-panel panel" data-card-filter-context="binder" aria-label="Filter gallery cards"></section>
      <section class="card-gallery-stage panel" id="seriesGridStage" aria-label="Starlight card gallery"></section>
    </div>
  </main>
  <div id="site-footer"></div>
  <div aria-hidden="true" aria-live="polite" id="cardOverlay" hidden></div>
  <script type="module" src="js/tcg-chrome.js?v=1.0"></script>
  <script src="js/cloud-collection.js?v=1.3.9" type="module"></script>
  <script src="js/site-dashboard.js?v=1.1" type="module"></script>
  <script src="js/app.js?v=1.0" type="module"></script>
  <script src="js/card-tile.js?v=1.0.0"></script>
  <script src="js/binder-theme-config.js?v=1.0.0"></script>
  <script src="js/starlight-perspective-card.js?v=1.0.0"></script>
  <script src="js/shared-ui.js?v=1.6.22"></script>
  <script src="js/qol-ui.js?v=94.2.10" defer></script>
</body>
</html>
