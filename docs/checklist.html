<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Registry | Starlight Card Binder</title>
  <link rel="icon" href="site_assets/Sora_Starlight_Logo_Primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tcg/site.css?v=2.0">
  <link rel="stylesheet" href="css/tcg/pages.css?v=2.0">
  <link rel="stylesheet" href="css/tcg/compat.css?v=2.0">
  <link rel="stylesheet" href="css/card-filters.css?v=1.1">
  <link rel="stylesheet" href="css/pages/checklist.css?v=1.3.1">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.11">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body data-page="checklist">
  <div id="site-header"></div>
  <main id="main" class="main">
  <section class="page-head panel">
  <p class="eyebrow" data-content="checklist.eyebrow">
                      Star Registry
                  </p>
  <h1 data-content="checklist.title">
                      Star Registry
                  </h1>
  <p data-content="checklist.lead">
                      Track every card by set, rarity, collection
                      status, and favorites.
                  </p>
  <div class="checklist-star-bits">
  <div>
  <h2><img class="star-bit-icon star-bit-icon--sm" src="site_assets/icons/star-bit.png?v=2" alt="" width="16" height="16" decoding="async"> <span data-content="checklist.exchangeTitle">Duplicate Card Exchange</span></h2>
  <p data-content="checklist.exchangeLead">
                              Review duplicate pulls and convert them into Star Bits without removing your final copy.
                          </p>
  </div>
  <a class="btn primary" href="star-bits.html" data-content="checklist.exchangeCta">Review Duplicates</a>
  </div>
  </section>
  <section class="card-filter-panel panel" data-card-filter-context="checklist" aria-label="Filter checklist cards"></section>
  <section class="panel table-wrap">
  <table class="table">
  <thead>
  <tr>
  <th>Card</th>
  <th>Name</th>
  <th>Series</th>
  <th>Category / Theme</th>
  <th>Rarity</th>
  <th>Quantity</th>
  <th>Status</th>
  <th>Favorite</th>
  </tr>
  </thead>
  <tbody id="checklistBody"></tbody>
  </table>
  </section>
  
  </main>
  <div id="site-footer"></div>
  <div aria-hidden="true" aria-live="polite" id="cardOverlay" hidden></div>
  <!--
          Cloud synchronization finishes before app.js starts.
      -->
  <script type="module" src="js/tcg-chrome.js?v=2.0"></script>
  <script type="module" src="js/pages/website-content-hydrate-page.js?v=1.2"></script>
  <script src="js/cloud-collection.js?v=1.3.0" type="module"></script>
  <script src="js/site-dashboard.js" type="module"></script>
  <script src="js/pages/checklist-page.js?v=1.0"></script>
  <script src="js/starlight-perspective-card.js?v=1.0.0"></script>
  <script src="js/shared-ui.js?v=1.6.21"></script>
  <script src="js/qol-ui.js?v=94.2.4" defer></script>
</body>
</html>
