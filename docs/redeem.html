<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Redeem A Code | Starlight Card Binder</title>
  <link rel="icon" href="site_assets/Sora_Starlight_Logo_Primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tcg/site.css?v=2.0">
  <link rel="stylesheet" href="css/tcg/pages.css?v=2.0">
  <link rel="stylesheet" href="css/tcg/compat.css?v=2.0">
  <link rel="stylesheet" href="css/pages/redeem.css?v=1.1">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.11">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body data-page="redeem">
  <div id="site-header"></div>
  <main id="main" class="redeem-page">
  <section class="redeem-panel"><p class="eyebrow" data-content="redeem.eyebrow">Special Rewards</p><h1 data-content="redeem.title">🎟 Redeem a Code</h1><p data-content="redeem.lead">Enter a Starlight code from streams, events, giveaways, or promotions. Rewards are saved directly to your account.</p>
  <form class="redeem-form" id="redeem-form"><label class="sr-only" for="code">Redemption code</label><input autocomplete="off" class="redeem-input" id="code" maxlength="48" placeholder="ENTER CODE" required=""/><div class="redeem-actions"><button class="redeem-button" id="redeem-button" type="submit" data-content="redeem.submitCta">Redeem Code</button><a class="redeem-link secondary" href="gallery.html" data-content="redeem.returnCta">Return to Binder</a></div></form>
  <section class="reward-box hidden" id="reward-box"><h2 id="reward-title"></h2><p id="reward-description"></p></section><p aria-live="polite" class="status" id="status" role="status"></p>
  </section></main>
  <div id="site-footer"></div>
  <script type="module" src="js/tcg-chrome.js?v=2.0"></script>
  <script type="module" src="js/pages/website-content-hydrate-page.js?v=1.2"></script>
  <script type="module" src="js/pages/redeem-page.js?v=1.5.17"></script>
  <script src="js/starlight-perspective-card.js?v=1.0.0"></script>
  <script src="js/shared-ui.js?v=1.6.19"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
