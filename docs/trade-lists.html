<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trade With Others | Starlight Card Binder</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.2">
  <link rel="stylesheet" href="css/app-shell.css?v=1.2.1">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.15">
  <link rel="stylesheet" href="css/pages/trade-lists.css?v=1.3">
  <link rel="stylesheet" href="css/pages/user-rankings.css?v=1.2.0">
  <link rel="stylesheet" href="css/avatar-frames.css?v=1.3.0">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.8">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body>
  <script src="js/embed-mode.js" type="module"></script>
  <div class="sky"></div>
  <main class="trade-page trade-hub-page">
    <section class="trade-head">
      <p class="eyebrow" data-content="trades.eyebrow">Collector Connections</p>
      <h1 data-content="trades.title">🤝 Trade With Others</h1>
      <p data-content="trades.lead">Browse public collectors, propose trades, and manage the cards you are searching for or offering from one place.</p>
    </section>

    <div class="trade-hub-tabs" role="tablist" aria-label="Trade hub views">
      <button type="button" class="active" data-trade-hub="collectors" aria-selected="true" data-content="trades.hubTabCollectors">Trade With Others</button>
      <button type="button" data-trade-hub="lists" aria-selected="false" data-content="trades.hubTabMyLists">My Wishlist</button>
    </div>

    <section class="trade-hub-panel rankings-page" data-trade-hub-panel="collectors" hidden>
      <section class="rankings-toolbar" aria-label="Rankings filters">
        <div class="rankings-toolbar-row">
          <label class="rankings-search" for="rankingsSearch">
            <span data-content="rankings.searchLabel">Search collectors</span>
            <input id="rankingsSearch" type="search" placeholder="Display name or username…" autocomplete="off" aria-controls="rankingsList" data-content-placeholder="rankings.searchPlaceholder">
          </label>
          <label class="rankings-sort" for="rankingsSort">
            <span data-content="rankings.sortLabel">Sort</span>
            <select id="rankingsSort">
              <option value="level" selected data-content="rankings.sortLevel">Highest level</option>
              <option value="collection" data-content="rankings.sortCollection">Collection %</option>
              <option value="unique" data-content="rankings.sortUnique">Most unique cards</option>
              <option value="name" data-content="rankings.sortName">Display name A–Z</option>
            </select>
          </label>
        </div>
        <p id="rankingsMeta" class="rankings-meta" aria-live="polite"></p>
      </section>

      <div id="rankingsStatus" class="rankings-status" role="status">
        <h2 data-content="rankings.loadingTitle">Loading rankings…</h2>
        <p data-content="rankings.loadingLead">Gathering public collectors.</p>
      </div>

      <ol id="rankingsList" class="rankings-list" aria-label="Collector rankings"></ol>
      <div id="rankingsPager" class="rankings-pager" hidden></div>
      <div id="rankingsLive" class="visually-hidden" aria-live="polite"></div>
    </section>

    <section class="trade-hub-panel" data-trade-hub-panel="lists" hidden>
      <div class="trade-tabs" role="tablist" aria-label="Trade list views">
        <button class="active" data-tab="wishlist" type="button" aria-selected="true" data-content="trades.tabWishlist">♡ Wishlist</button>
        <button data-tab="trade" type="button" aria-selected="false" data-content="trades.tabTrade">↔ For Trade</button>
        <button data-tab="all" type="button" aria-selected="false" data-content="trades.tabAll">📚 All Cards</button>
      </div>
      <section class="trade-panel">
        <div class="trade-tools">
          <label class="trade-search-label" for="tradeSearch">
            <span class="visually-hidden">Search cards</span>
            <input id="tradeSearch" type="search" placeholder="Search names, numbers…" aria-label="Search cards">
          </label>
          <label class="privacy-toggle">
            <input id="publicLists" type="checkbox" checked>
            Show these lists on my public profile
          </label>
        </div>
        <div id="tradeGrid" class="trade-grid" aria-live="polite"></div>
        <p id="tradeStatus" class="trade-status" role="status"></p>
      </section>
    </section>
  </main>
  <script type="module" src="js/pages/website-content-hydrate-page.js?v=1.3"></script>
  <script type="module" src="js/pages/trade-hub-page.js?v=1.0.0"></script>
  <script src="js/shared-ui.js?v=1.6.15"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
