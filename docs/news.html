<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>News &amp; Updates | Starlight Cards</title>
  <link rel="icon" href="site_assets/Sora_Starlight_Logo_Primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tcg/site.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/pages.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/compat.css?v=1.0">
  <link rel="stylesheet" href="css/tcg/home.css?v=1.0">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body data-page="news">
  <div id="site-header"></div>
  <main id="main">
    <header class="page-hero">
      <div class="asset-placeholder bg" aria-hidden="true">INSERT ASSET</div>
      <p class="kicker" data-content="home.newsEyebrow">Latest from Starlight</p>
      <h1 data-content="home.newsTitle">News &amp; Updates</h1>
      <p class="lead">Announcements, development notes, and featured updates from Sora Starlight.</p>
    </header>
    <section class="section">
      <div id="newsList" class="news-track" aria-live="polite">
        <div class="empty" data-content="home.newsLoading">Loading the latest Starlight news…</div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/tcg-chrome.js?v=1.0"></script>
  <script type="module" src="js/pages/website-content-hydrate-page.js?v=1.2"></script>
  <script type="module" src="js/home-news.js?v=1.0"></script>
</body>
</html>
